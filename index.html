<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="tasks.css">


    <title>My Task Board</title>
</head>

<body>
    <div>
        <!-- Title -->
        <div class="row">
            <div class="col-md-12" id="title">My Task Board</div>
        </div>

        <!-- Form -->
        <div class="row justify-content-center align-items-center text-center">
            <div class="col-6 justify-content-center align-items-center" id="form">
                <form id="dataForm">
                    <textarea name="noteText" id="noteText" placeholder="Enter note here" rows="4"
                        cols="50" required></textarea><br><br>
                    <input type="date" name="targetDate" id="targetDate" required>
                    <input type="time" name="targetTime" id="targetTime" required><br><br>
                    <button type="submit" class="btn btn-success" id="save">Save</button>
                    <button type="reset" class="btn btn-danger">Clear</button>
                </form>
            </div>
        </div>

        <!-- Notes -->
        <div class="container">
            <div class="row" id="notesHere">
                <!-- Notes inserted here -->

            </div>
        </div>

        <script src="script.js"></script>
</body>

</html>
